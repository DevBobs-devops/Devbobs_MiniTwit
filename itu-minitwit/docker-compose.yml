# version: '3'
services:
  minitwit:
    build: . # build the image from the Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./minitwit/data:/app/Data  # mount database folder on vm to : our workdir in Dockerfile is /app, and the rest need to match our connectionstring

  prometheus:
    build: 
      dockerfile: ./Dockerfile
      context: ./monitoring/prometheus
    image: prometheus_image
    volumes:
      - prometheus_data:/prometheus
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"

  alloy:
    build:
      dockerfile: ./Dockerfile
      context: ./monitoring/alloy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # IMPORTANT: This actually allows Alloy to connect to the docker.sock file which exists on your container's host machine
    container_name: alloy
    command: 
      - "run"
      - "/etc/alloy/config.alloy"
    depends_on:
      - loki    

  loki:
    build: 
      dockerfile: ./Dockerfile
      context: ./monitoring/loki
    image: loki_image
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
    command: "--config.file=/etc/loki/loki.yml"

  grafana:
    build: 
      dockerfile: ./Dockerfile
      context: ./monitoring/grafana
    image: grafana_image
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana 

volumes:
  loki-data: 
  grafana-storage: {} 
  prometheus_data: {}

#Inspiration/guide: https://medium.com/@Shamimw/docker-a-complete-tutorial-part3-docker-compose-2e3b2f568a6f

#Inspiration/guide: https://kycha-blog.org/posts/practical-guide-grafana-alloy-loki-docker
