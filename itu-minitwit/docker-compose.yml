# version: '3'

#THIS FILE IS USED IN CI/CD only
services:
  minitwit:
    build: . # build the image from the Dockerfile
    image: minitwit_image
    environment:
      - ASPNETCORE_ENVIRONMENT=Development #Ensure that locally run env is Development. Fix found here: https://oneuptime.com/blog/post/2026-01-25-docker-compose-development-environments/view & here https://learn.microsoft.com/en-us/aspnet/core/fundamentals/environments?view=aspnetcore-10.0
      - ConnectionStrings__DefaultConnection=Host=database;Port=5432;Database=default_database;Username=username;Password=password
    ports:
      - "8080:8080"
    volumes:
      - ./minitwit/data:/app/Data  # mount database folder on vm to : our workdir in Dockerfile is /app, and the rest need to match our connectionstring
    depends_on:
      database:
        condition: service_healthy

  prometheus:
    build: 
      dockerfile: ./Dockerfile
      context: ./monitoring/prometheus
    image: prometheus_image
    volumes:
      - prometheus_data:/prometheus
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"

 # taken from: https://github.com/gaelgthomas/docker-compose-with-postgresql/blob/main/docker-compose.yml

  database:
    image: "postgres:latest"
    ports:
      - 5433:5432
    environment:
      POSTGRES_USER: username   
      POSTGRES_PASSWORD: password 
      POSTGRES_DB: default_database 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U username -d default_database"]
      interval: 5s
      timeout: 5s
      retries: 5

  alloy:
    build:
      dockerfile: ./Dockerfile
      context: ./monitoring/alloy
    image: alloy_image
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # IMPORTANT: This actually allows Alloy to connect to the docker.sock file which exists on your container's host machine
    container_name: alloy
    command: 
      - "run"
      - "/etc/alloy/config.alloy"
    depends_on:
      - loki    

  loki:
    build: 
      dockerfile: ./Dockerfile
      context: ./monitoring/loki
    image: loki_image
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
    command: "--config.file=/etc/loki/loki.yml"

  grafana:
    build: 
      dockerfile: ./Dockerfile
      context: ./monitoring/grafana
    image: grafana_image
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana 

volumes:
  loki-data: 
  grafana-storage: {} 
  prometheus_data: {}

#Inspiration/guide: https://medium.com/@Shamimw/docker-a-complete-tutorial-part3-docker-compose-2e3b2f568a6f

#Inspiration/guide: https://kycha-blog.org/posts/practical-guide-grafana-alloy-loki-docker
