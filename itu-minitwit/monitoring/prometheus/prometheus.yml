global:
  scrape_interval: 15s # By default, scrape targets every 15 seconds.
  evaluation_interval: 15s # Evaluate rules every 15 seconds.

  # Attach these extra labels to all timeseries collected by this Prometheus instance.
  external_labels:
    monitor: "codelab-monitor"

rule_files:
  - "prometheus.rules.yml"

scrape_configs:
  - job_name: "prometheus"

    # Override the global default and scrape targets from this job every 5 seconds.
    scrape_interval: 5s

    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "itu-minittwit-app"

    # Override the global default and scrape targets from this job every 5 seconds.
    scrape_interval: 5s

    static_configs:
      - targets: ["minitwit:8080"]
        labels:
          group: "production"

  - job_name: "itu-minittwit-swarm"
    scrape_interval: 10s #Scrape every 10 seconds

    #following this guide: https://www.innoq.com/en/blog/2020/04/scraping-docker-swarm-service-instances-with-prometheus/
    dns_sd_configs:
      - names:
          - 'tasks.minitwit_minitwit'
        type: 'A'
        port: 8080

    #Makes grafana more readable, can be edited
    metric_relabel_configs:
      - source_labels: [instance]
        regex: '^([0-9]+)\.([0-9]+)\.([0-9]+)\.([0-9]+):([0-9]+)$'
        replacement: '${1}_${2}_${3}_${4}'
        target_label: instance