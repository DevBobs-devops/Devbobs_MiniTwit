version: '3.8'

services:

  minitwit:
    image: minitwit_image
    environment:
      - ASPNETCORE_ENVIRONMENT=Development #specified for clarity
      - ConnectionStrings__DefaultConnection=Host=database;Port=5432;Database=default_database;Username=username;Password=password
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
    ports:
      - '8080:8080'
    networks:
      - redis_net
    deploy:
      replicas: 4

  visualizer:
    image: dockersamples/visualizer:stable
    ports:
      - "8888:8888"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    deploy:
      placement:
        constraints: [node.role == manager]

  prometheus:
    image: prometheus_image
    volumes:
      - prometheus-storage:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    deploy:
     replicas: 1
     placement:
        constraints: [node.role == manager]

  alloy: 
    image: alloy_image
    command: 
      - "run"
      - "/etc/alloy/config.alloy"
    volumes: 
      - /var/run/docker.sock:/var/run/docker.sock 
    deploy:
      mode: global


  loki: 
    image: loki_image
    ports:
      - "3100:3100"
    volumes:
      - loki-storage:/loki
    command: "--config.file=/etc/loki/loki.yml"
    deploy:
     replicas: 1
     placement:
      constraints: [node.role == manager]


  grafana:
    image: grafana_image
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
    deploy:
     replicas: 1
     placement:
      constraints: [node.role == manager]


#  loadbalancer:
#    image: nginx
#    ports:
#      - '80:80'
#    volumes:
#      - /loadbalancer:/etc/nginx/conf.d
#    deploy:
#      replicas: 2

  database:
    image: "postgres:latest"
    ports:
      - 5433:5432
    environment:
      POSTGRES_USER: username   
      POSTGRES_PASSWORD: password 
      POSTGRES_DB: default_database 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U username -d default_database"]
      interval: 5s
      timeout: 5s
      retries: 5

# https://oneuptime.com/blog/post/2026-03-31-redis-deploy-docker-swarm/view
  redis:
    image: redis:7-alpine
    command: >
      redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - target: 6379
        published: 6379
    volumes:
      - redis_data:/data
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager   
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - redis_net  

volumes:
  loki-storage: {}
  grafana-storage: {} 
  prometheus-storage: {}
  redis_data:
    driver: local

networks:
  redis_net:
    driver: overlay
    attachable: true