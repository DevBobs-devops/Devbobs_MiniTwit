version: '3.8'

services:

  minitwit:
    image: minitwit_image
    environment:
      - ASPNETCORE_ENVIRONMENT=Development #specified for clarity
      - ConnectionStrings__DefaultConnection=Host=database;Port=5432;Database=default_database;Username=username;Password=password
    ports:
      - '8080:8080'
    deploy:
      replicas: 4


  prometheus:
    image: prometheus_image
    volumes:
      - prometheus-storage:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    deploy:
     replicas: 1
     placement:
        constraints: [node.role == manager]

  alloy: 
    image: alloy_image
    command: 
      - "run"
      - "/etc/alloy/config.alloy"
    volumes: 
      - /var/run/docker.sock:/var/run/docker.sock 
    deploy:
      mode: global


  loki: 
    image: loki_image
    ports:
      - "3100:3100"
    volumes:
      - loki-storage:/loki
    command: "--config.file=/etc/loki/loki.yml"
    deploy:
     replicas: 1
     placement:
      constraints: [node.role == manager]


  grafana:
    image: grafana_image
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
    deploy:
     replicas: 1
     placement:
      constraints: [node.role == manager]


#  loadbalancer:
#    image: nginx
#    ports:
#      - '80:80'
#    volumes:
#      - /loadbalancer:/etc/nginx/conf.d
#    deploy:
#      replicas: 2

  database:
    image: "postgres:latest"
    ports:
      - 5433:5432
    environment:
      POSTGRES_USER: username   
      POSTGRES_PASSWORD: password 
      POSTGRES_DB: default_database 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U username -d default_database"]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  loki-storage: {}
  grafana-storage: {} 
  prometheus-storage: {}
