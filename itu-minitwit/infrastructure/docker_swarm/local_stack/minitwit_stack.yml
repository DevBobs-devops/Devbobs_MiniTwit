version: '3.8'

services:

  minitwit:
    image: minitwit_image
    environment:
      - ASPNETCORE_ENVIRONMENT=Development #specified for clarity
      - ConnectionStrings__DefaultConnection=Host=database;Port=5432;Database=default_database;Username=username;Password=password
    networks:
      - caddy
      - default
    deploy:
      replicas: 4
      labels:
        caddy: minitwit.localhost # host name 
        caddy.reverse_proxy: "{{upstreams 8080}}" #where to send traffic


  prometheus:
    image: prometheus_image
    volumes:
      - prometheus-storage:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]


  alloy:
    image: alloy_image
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/newconfig.alloy
    ports: 
      - 12345:12345
    deploy:
      mode: global          # <-- one per node, not replicated


  loki:
    image: loki_image
    ports:
      - "3100:3100"
    volumes:
      - loki-storage:/loki
    command: "--config.file=/etc/loki/loki.yml"
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]


  grafana:
    image: grafana_image
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]




  database:
    image: "postgres:latest"
    ports:
      - 5433:5432
    environment:
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
      POSTGRES_DB: default_database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U username -d default_database"]
      interval: 5s
      timeout: 5s
      retries: 5

  caddy:
    image: lucaslorentz/caddy-docker-proxy:ci-alpine
    ports:
    - target: 80
      published: 80
      protocol: tcp
      mode: host
    - target: 443
      published: 443
      protocol: tcp
      mode: host
    environment:
      - CADDY_INGRESS_NETWORKS=minitwit_caddy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - caddy_data:/data
    restart: unless-stopped
    networks:
      - caddy
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]

volumes:
  loki-storage: {}
  grafana-storage: {}
  prometheus-storage: {}
  caddy_data: {}

networks:
  caddy:
    driver: overlay
    attachable: true