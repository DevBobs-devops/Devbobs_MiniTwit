# Edited from BDSA: https://github.com/ITU-BDSA2024-GROUP15/Chirp/blob/main/.github/workflows/build_and_test.yml
name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: #Allow manual trigger of workflow

jobs:
  linter-codeformat:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: CSharpier Linter
        uses: guibranco/github-csharpier-linter-action@a5214a476742ce4a0f755611581276c50081527a
  hadolint-dockerfile:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v3
    - uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5
      with:
        dockerfile: itu-minitwit/Dockerfile
  
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore itu-minitwit

      - name: Build
        run: dotnet build itu-minitwit --no-restore

      - name: Run unit and integration tests
        run: dotnet test itu-minitwit --filter FullyQualifiedName!~PlaywrightTests --configuration Release

      # ── API test (existing) ──────────────────────────────────────────────────
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip & Pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests

      - name: Start app via Docker Compose
        run: |
          cd itu-minitwit
          docker compose up --build -d

      - name: Wait for app to be ready
        run: |
          echo "Waiting for app..."
          for i in $(seq 1 24); do
            if curl -sf http://localhost:8080 > /dev/null 2>&1; then
              echo "App is up after $((i * 5)) seconds"
              exit 0
            fi
            echo "  attempt $i/24 - not ready yet"
            sleep 5
          done
          echo "App never became ready"
          docker compose -f itu-minitwit/docker-compose.yml logs
          exit 1

      - name: Run API tests (pytest)
        run: pytest itu-minitwit/test/minitwit_sim_api_test.py

    
    
      # ── E2E / UI tests (Playwright) ──────────────────────────────────────────
      - name: Run E2E tests in Docker
        run: |
          docker compose -f itu-minitwit/docker-compose.test.yml up \
            --build \
            --abort-on-container-exit \
            --exit-code-from e2e-tests

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: "**/*.trx"

      - name: Tear down test compose
        if: always()
        run: docker compose -f itu-minitwit/docker-compose.test.yml down -v

    
    
