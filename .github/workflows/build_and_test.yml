# Edited from BDSA: https://github.com/ITU-BDSA2024-GROUP15/Chirp/blob/main/.github/workflows/build_and_test.yml
name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: #Allow manual trigger of workflow

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore itu-minitwit
    - name: Build
      run: dotnet build itu-minitwit --no-restore
    - name: Test Dotnet
      run: |
        dotnet test itu-minitwit --filter FullyQualifiedName!~PlaywrightTests --configuration Release
# Inspired by this link https://docs.github.com/en/actions/tutorials/build-and-test-code/python
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
          python-version: '3.11'
    - name: Install pip & Pytest
      run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install requests
    - name: Run MiniTwit
      run: |
        dotnet run itu-minitwit/src/MiniTwit.Web/MiniTwit.Web.csproj
    - name: Test Pytest
      run: | 
        pytest itu-minitwit/test/minitwit_sim_api_test.py
      

    
    
