name: Build LaTeX document
on: [push]
jobs:
  build_latex:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v6


      - name: Download PlantUML JAR
        run: |
          mkdir -p /opt/plantuml
          wget -O /opt/plantuml/plantuml.jar https://sourceforge.net/projects/plantuml/files/plantuml.jar/download

      - name: Install dependencies (non-LaTeX)
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: graphviz default-jre inkscape perl
          version: 1.0

      - name: Setup LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: report/src
          latexmk_use_lualatex: true
          extra_system_packages: inkscape
        env:
          TEXINPUTS: ".:report/src/:"

      - name: Print Folder Tree
        uses: jaywcjlove/github-action-folder-tree@main
        with:
          exclude: "node_modules|dist|.git|.husky"
          path: ./
          depth: 3

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v6
        with:
          name: BSc_group_k
          path: report/src/BSc_group_k.pdf
