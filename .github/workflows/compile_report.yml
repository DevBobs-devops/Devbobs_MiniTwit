name: Build LaTeX document
on: [push]
jobs:
  build_latex:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz default-jre texlive-luatex texlive-latex-extra inkscape latexmk perl

      - name: Download PlantUML JAR
        run: |
          mkdir -p /opt/plantuml
          wget -O /opt/plantuml/plantuml.jar https://sourceforge.net/projects/plantuml/files/plantuml.jar/download

      - name: Create build directory
        run: mkdir -p report/out/diagrams-ltx

      - name: Create build directory
        run: mkdir -p out/diagrams-ltx

      - name: Create build directory
        run: mkdir -p report/src/out/diagrams-ltx

      - name: Compile LaTeX document
        run: |
          cd report
          latexmk -lualatex -interaction=nonstopmode -shell-escape\
            src/main.tex
        env:
          PLANTUML_JAR: /opt/plantuml/plantuml.jar
          TEXINPUTS: "./src:**:"

      - name: Print Folder Tree
        uses: jaywcjlove/github-action-folder-tree@main
        with:
          exclude: "node_modules|dist|.git|.husky"
          path: ./
          depth: 3
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v6
        with:
          name: BSc_group_k.pdf
          path: report/main.pdf
