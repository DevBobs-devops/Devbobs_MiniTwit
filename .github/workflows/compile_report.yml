name: Build LaTeX document
on: [push]
jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Git repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz default-jre texlive-luatex texlive-latex-extra inkscape latexmk perl

      - name: Download PlantUML JAR
        run: |
          mkdir -p /opt/plantuml
          wget -O /opt/plantuml/plantuml.jar https://sourceforge.net/projects/plantuml/files/plantuml.jar/download

      - name: Create build directory
        run: mkdir -p report/build

      - name: Compile LaTeX document
        run: |
          cd report
          latexmk -lualatex -interaction=nonstopmode -shell-escape src/main.tex
        env:
          PLANTUML_JAR: /opt/plantuml/plantuml.jar

      - name: Commit and push PDF
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add report/build/main.pdf
          git commit -m "Build LaTeX document with PlantUML" || true
          git push
