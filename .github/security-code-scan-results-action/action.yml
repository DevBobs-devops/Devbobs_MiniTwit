name: "SecurityCodeScan"
description: "Security Code Scan action to upload code scanning results"
branding:
  icon: "check-circle"
  color: "purple"
inputs:
  sarif_directory:
    description: The output directory where SARIF files should be collected.
    required: false
    default: "../results"
runs:
  using: "composite"
  steps:
    - name: Convert sarif
      shell: bash
      env:
        SARIF_DIR: ${{ inputs.sarif_directory }}
      run: |
        dotnet tool install --global Sarif.Multitool
        outputDir="$SARIF_DIR"
        mkdir -p $outputDir

        cat << 'EOF' > convert.js
          const fs = require('fs')

          var args = process.argv.slice(2);
          var sarif = JSON.parse(fs.readFileSync(args[0], "utf8"));

          // Update version to 2.1.0
          sarif.version = "2.1.0";

          for (run of sarif.runs) {
            // Ensure tool.driver exists
            if (!run.tool) run.tool = {};
            if (!run.tool.driver) run.tool.driver = {};

            // Move tool-level properties to tool.driver
            if (run.tool.name) {
              run.tool.driver.name = run.tool.name;
              delete run.tool.name;
            }
            if (run.tool.version) {
              run.tool.driver.version = run.tool.version;
              delete run.tool.version;
            }
            if (run.tool.semanticVersion) {
              run.tool.driver.semanticVersion = run.tool.semanticVersion;
              delete run.tool.semanticVersion;
            }
            
            // Remove fileVersion as it's not valid in SARIF 2.1.0
            if (run.tool.fileVersion) {
              delete run.tool.fileVersion;
            }
            if (run.tool.driver.fileVersion) {
              delete run.tool.driver.fileVersion;
            }

            // Move rules from run level to tool.driver level if they exist
            if (run.rules && typeof run.rules === 'object' && !Array.isArray(run.rules)) {
              // Convert rules object to array format
              let rulesArray = [];
              for (const [ruleId, ruleObj] of Object.entries(run.rules)) {
                if (!ruleObj.id) ruleObj.id = ruleId;
                rulesArray.push(ruleObj);
              }
              run.tool.driver.rules = rulesArray;
              delete run.rules;
            }

            // Initialize results and rules if they don't exist
            if (!run.results) run.results = [];
            if (!run.tool.driver.rules) run.tool.driver.rules = [];

            // Set SecurityCodeScan as the driver
            run.tool.driver.name = "SecurityCodeScan";
            run.tool.driver.fullName = "Vulnerability Patterns Detector for C# and VB.NET";
            run.tool.driver.informationUri = "https://security-code-scan.github.io";

            // Filter results to only include SCS rules
            run.results = run.results.filter((e => e.ruleId && e.ruleId.startsWith("SCS")));
            run.tool.driver.rules = run.tool.driver.rules.filter((e => e.id && e.id.startsWith("SCS")));

            for (let i = 0; i < run.results.length; ++i) {
              run.results[i].ruleIndex = undefined;
              run.results[i].relatedLocations = undefined;

              if (run.results[i].locations === undefined || run.results[i].locations.length === 0) {
                const messageText = run.results[i].message && run.results[i].message.text ? run.results[i].message.text : "";
                const match = messageText.match(/(.*) in (.*)\((\d+)\)(:.*)/);
                
                if (match) {
                  run.results[i].message.text = match[1];
                  run.results[i].locations = [{
                    "physicalLocation" : {
                      "artifactLocation" : {
                        "uri" : "file:///" + match[2].replace(/\\\\/g, "/")
                      },
                      "region" : {
                        "startLine": Number(match[3]),
                        "startColumn": 1,
                        "endLine": Number(match[3]),
                        "endColumn": 1
                      }
                    }
                  }];
                }
              }
            }

            for (rule of run.tool.driver.rules) {
              rule.shortDescription = undefined;
              if (rule.helpUri) {
                rule.help = { "text" : rule.helpUri};
              }
            }

            run.language = undefined;
          }

          var converted = JSON.stringify(sarif, null, 2);
          fs.writeFileSync(args[1], converted);
        EOF

        cat << 'EOF' > merge.js
          const fs = require('fs')
          const path = require('path')

          var args = process.argv.slice(2);
          var outputFile = args[0];
          var sarifFiles = args.slice(1);

          // Start with the first file as the base
          var merged = JSON.parse(fs.readFileSync(sarifFiles[0], "utf8"));
          var baseRun = merged.runs[0];

          // Merge all subsequent files into the first run
          for (let i = 1; i < sarifFiles.length; i++) {
            var sarif = JSON.parse(fs.readFileSync(sarifFiles[i], "utf8"));
            
            for (let run of sarif.runs) {
              if (run.results) {
                baseRun.results = baseRun.results.concat(run.results);
              }
              
              // Merge rules (avoid duplicates)
              if (run.tool && run.tool.driver && run.tool.driver.rules) {
                const existingRuleIds = new Set(baseRun.tool.driver.rules.map(r => r.id));
                for (let rule of run.tool.driver.rules) {
                  if (!existingRuleIds.has(rule.id)) {
                    baseRun.tool.driver.rules.push(rule);
                    existingRuleIds.add(rule.id);
                  }
                }
              }
            }
          }

          // Ensure only one run in the merged file
          merged.runs = [baseRun];

          var converted = JSON.stringify(merged, null, 2);
          fs.writeFileSync(outputFile, converted);
          console.log("Merged " + sarifFiles.length + " SARIF files into " + outputFile);
        EOF

        i=0
        for sarifFile in $(find ./ -name '*.sarif')
        do
          echo "Processing: $sarifFile"
          node convert.js "$sarifFile" "$sarifFile"
          i=$((i+1))
        done

        # Merge all converted SARIF files into one
        echo "Merging SARIF files..."
        sarifFiles=$(find ./ -name '*.sarif' -type f)
        if [ ! -z "$sarifFiles" ]; then
          node merge.js "$outputDir/merged.sarif" $sarifFiles
          rm $sarifFiles
        fi
